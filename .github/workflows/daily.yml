name: build

on:
  schedule:
    # 每天一轮询（UTC 03:17 = 本地 11:17），按主人要求「一天一轮询」
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-packs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build packs.json
        run: node scripts/build.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- packs.json; then
            echo "packs.json 没变"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs.json
          git commit -m "chore: rebuild packs.json"
          git push
